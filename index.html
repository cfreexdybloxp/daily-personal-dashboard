<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1017" />
    <meta name="description" content="Daily — Tu centro personal de información matutina: clima, noticias verificadas, filosofía y curiosidades." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Daily — Centro Personal</title>
  </head>
  <body>
    <div class="app-container">
      <!-- Encabezado Compacto -->
      <header class="header">
        <div class="brand">
          <span class="brand-title">Daily</span>
          <span class="brand-badge">Brief</span>
        </div>
        <div class="header-meta">
          <span id="current-date-pill" class="date-pill">Cargando fecha...</span>
          <button id="open-settings-header-btn" class="icon-btn" title="Ajustes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <!-- Vistas Principales -->
      <main id="main-content" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Sección 1: Clima -->
        <section id="weather-section"></section>

        <!-- Sección 2: Frase Filosófica -->
        <section id="quote-section"></section>

        <!-- Sección 3: Idea / Curiosidad -->
        <section id="curiosity-section"></section>

        <!-- Sección 4: Noticias -->
        <section id="news-section"></section>
      </main>

      <!-- Vista de Artículos Guardados (Oculta por defecto) -->
      <section id="saved-section" style="display: none;"></section>

      <!-- Navegación Inferior -->
      <div id="bottom-nav-container"></div>

      <!-- Modal de Ajustes -->
      <div id="settings-modal-overlay" class="modal-overlay"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
